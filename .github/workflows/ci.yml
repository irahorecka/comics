name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Schedule for the workflow to run at 00:00 every Sunday
    - cron: '0 0 * * 0'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 has no build for Ubuntu 26.04 (ubuntu-latest)
          - os: ubuntu-24.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Python dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-py-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt', '**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-py-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Install Playwright browsers
      run: python -m playwright install --with-deps

    - name: Test with pytest
      run: |
        pip install -e .
        pytest -W ignore -vv .
